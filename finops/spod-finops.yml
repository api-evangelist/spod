meters:
- name: base_product
  description: Base product price per fulfilled order item, varying by product type.
  unit: order_item
  aggregation: sum
  dimensions:
  - account
  - product_type
  - facility
- name: print_area
  description: Additional print areas beyond the first included area, billed per area.
  unit: print_area
  aggregation: sum
  dimensions:
  - account
  - order
- name: print_technique_surcharge
  description: One-time per-order surcharge for Flex, Special Flex, or Flock printing.
  unit: order
  aggregation: sum
  dimensions:
  - account
  - order
- name: shipping
  description: Shipping cost per order, based on order value and fulfillment facility.
  unit: order
  aggregation: sum
  dimensions:
  - account
  - order
  - facility
principles:
- name: Visibility
  description: Track cost per order broken down into base product, print areas, print-technique surcharge, and shipping so margin per sale is clear.
- name: Allocation
  description: Attribute order costs to shops/points of sale and product types to see which lines carry fulfillment cost.
- name: Optimization
  description: Limit orders to a single print area where possible, prefer DTG/DTF (no per-area cost) over Flex/Flock, and choose product types and shipping types that protect margin.
- name: Accountability
  description: Reconcile monthly SPOD invoices against orders placed via the API; ensure retail pricing consistently exceeds SPOD order cost plus tax.
