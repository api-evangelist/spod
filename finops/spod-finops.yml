description: >-
  FinOps view of SPOD (Spreadconnect) spend. There is no subscription, setup, or
  monthly platform fee and the REST API itself is free; cost is incurred only
  when orders are fulfilled. Each order is billed as base product price + print
  cost (first area included, additional areas and Flex/Flock surcharge extra) +
  shipping + tax. Because SPOD invoices the seller independently of the retail
  price charged to end customers, unit economics per order are the primary lever
  for margin management.
notes: >-
  Per-product and per-shipping-tier rates are not reconciled here; verify on the
  SPOD/Spreadconnect help center. US and EU fulfillment carry different product
  and shipping prices.
