openapi: 3.2.0
info:
  title: SPOD (Spreadconnect) Fulfillment REST Common API
  version: '1.0'
  description: REST API for SPOD (Spreadshirt Print-On-Demand), now branded Spreadconnect.
  contact:
    name: SPOD
    url: https://www.spod.com
    email: business@spod.com
  termsOfService: https://faq.spod.com/hc/en-us/articles/360020630280
servers:
- url: https://rest.spod.com
  description: Production
- url: https://rest.spreadconnect-staging.app
  description: Staging / test environment
security:
- access_token: []
tags:
- name: Common
paths:
  /authentication:
    get:
      tags:
      - Common
      operationId: authenticationInfo
      summary: Verify the API access token
      description: Returns authentication information for the supplied access token, used to confirm credentials are valid.
      responses:
        '200':
          description: Authentication information.
        '401':
          description: Missing or invalid access token.
components:
  securitySchemes:
    access_token:
      type: apiKey
      in: header
      name: X-SPOD-ACCESS-TOKEN
      description: Per-account API access token generated in the SPOD / Spreadconnect web application. Send it as a header on every request.
