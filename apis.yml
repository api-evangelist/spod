aid: spod
url: https://raw.githubusercontent.com/api-evangelist/spod/refs/heads/main/apis.yml
name: SPOD
kind: company
description: SPOD (Spreadshirt Print-On-Demand), now branded Spreadconnect, is the
  print-on-demand and dropshipping fulfillment service from Spreadshirt. Its REST
  API (base https://rest.spod.com) lets any shop system create customizable articles
  from designs, place and manage orders, choose shipping types and track shipments,
  browse the catalog of 250+ product types, check stock, and subscribe to webhook
  notifications for article, order, and shipment events. Authentication is a per-account
  API access token sent in the X-SPOD-ACCESS-TOKEN header. There are no setup or
  monthly fees; sellers are invoiced per fulfilled order (base product price plus
  print and shipping costs).
